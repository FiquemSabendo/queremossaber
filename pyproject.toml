[project]
name = "queremossaber"
version = "0.1.0"
description = ""
authors = [
    { name = "Vitor Baptista", email = "vitor@vitorbaptista.com" },
]
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "django>=5.1.3,<6",
    "django-widget-tweaks>=1.5.0,<2",
    "django-environ==0.11.2",
    "django-storages[s3]>=1.14.4,<2",
    "raven==6.10.0",
    "psycopg2-binary>=2.9.10,<3",
    "libsass>=0.23.0,<1",
    "whitenoise>=6.8.2,<7",
    "gunicorn>=23.0.0,<24",
    "sentry-sdk[django]>=2.19.2,<3",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=4.4.6,<5",
    "django-livesync==0.5",
    "honcho>=2.0.0,<3",
    "pre-commit>=4.0.1,<5",
    "pytest-django>=4.9.0,<5",
    "watchdog>=6.0.0,<7",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "web.settings_test"
